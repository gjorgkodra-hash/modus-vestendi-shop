<style>
:root{
  --bg:#ffffff; --soft:#f5f2ee; --soft2:#efe9e1; --ink:#1a1a1a; --muted:#6b6b6b; --line:#e6e1da;
  --accent:#4c2f2a; --tan:#deb598; --sale:#c8102e; --good:#2f7a4a;
  --r:4px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,"Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:1px solid var(--ink);background:#fff;color:var(--ink);border-radius:var(--r);padding:10px 16px}
button.primary{background:var(--ink);color:#fff;font-weight:600}
button.primary:hover{background:#000}
button.ghost{border-color:var(--line)}
button:disabled{opacity:.4;cursor:not-allowed}
input,select,textarea{font:inherit;width:100%;padding:12px;border:1px solid #bdb6ad;border-radius:var(--r);background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ink);outline-offset:-1px}
label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px}
.wrap{max-width:1280px;margin:0 auto;padding:0 16px}
@media(min-width:900px){.wrap{padding:0 28px}}
/* promo strip */
.promo{background:var(--ink);color:#fff;font-size:12.5px;text-align:center;padding:8px 12px;letter-spacing:.02em}
.promo b{font-weight:600}
/* header */
header{position:sticky;top:0;z-index:40;background:#fff;border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:14px;height:60px}
.logo{display:flex;align-items:center;gap:9px;font-family:Jost,sans-serif;font-size:17px;letter-spacing:.16em;text-transform:lowercase;white-space:nowrap}
.logo img{height:28px}
.search{flex:1;max-width:520px;margin:0 auto;position:relative}
.search input{padding:10px 12px 10px 38px;background:var(--soft);border-color:var(--soft);border-radius:999px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.icons{display:flex;align-items:center;gap:4px;margin-left:auto}
.ib{position:relative;border:0;background:none;padding:8px;display:grid;place-items:center;border-radius:50%}
.ib:hover{background:var(--soft)}
.cnt{position:absolute;top:2px;right:0;background:var(--accent);color:#fff;font-size:10px;font-weight:700;min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
.lang{border:1px solid var(--line);border-radius:999px;padding:5px 8px;width:auto;font-size:12.5px;background:#fff}
@media(max-width:719px){.hrow .search{display:none}.msearch{display:block!important;padding:0 0 10px}.logo span{font-size:14px;letter-spacing:.12em}}
.msearch{display:none}
nav.gens{display:flex;gap:18px;padding:2px 0 0;font-size:14px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
nav.gens a{padding:8px 0 6px;border-bottom:2px solid transparent;color:#555}
nav.gens a.on{border-bottom-color:var(--ink);color:var(--ink)}
nav.cats{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;border-top:1px solid var(--line)}
nav.cats::-webkit-scrollbar{display:none}
nav.cats a{white-space:nowrap;padding:12px 12px;font-size:14px;font-weight:500;border-bottom:2px solid transparent;color:#333}
nav.cats a.on,nav.cats a:hover{border-bottom-color:var(--ink);color:var(--ink)}
nav.cats a.hot{color:var(--sale)}
/* hero */
.hero{display:grid;grid-template-columns:1fr;background:var(--soft2);margin:18px 0 8px;border-radius:var(--r);overflow:hidden;min-height:260px}
@media(min-width:760px){.hero{grid-template-columns:1.1fr 1fr;min-height:400px}}
.hero .txt{padding:28px 24px;display:flex;flex-direction:column;justify-content:center;gap:12px}
@media(min-width:760px){.hero .txt{padding:48px}}
.hero h1{font-family:Jost,sans-serif;font-weight:400;font-size:clamp(28px,4.4vw,48px);line-height:1.08;margin:0;letter-spacing:.01em}
.hero p{margin:0;color:#444;max-width:420px}
.hero .img{background:var(--tan) center/cover no-repeat;min-height:240px}
.hero button{align-self:flex-start;padding:13px 26px}
.usp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 6px;font-size:12.5px;color:#333}
.usp div{display:flex;gap:8px;align-items:center;justify-content:center;background:var(--soft);padding:10px 8px;border-radius:var(--r);text-align:center}
@media(max-width:600px){.usp{grid-template-columns:repeat(3,minmax(0,1fr));font-size:11px}.usp div{padding:8px 4px}.hero{margin-top:12px}.hero .txt{padding:22px 20px}.hero .img{min-height:190px}}
h2.sec{font-size:20px;font-weight:700;margin:30px 0 12px;display:flex;justify-content:space-between;align-items:baseline}
h2.sec a{font-size:13px;font-weight:500;text-decoration:underline}
.brands{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.brands::-webkit-scrollbar{display:none}
.brands a{white-space:nowrap;border:1px solid var(--line);padding:12px 18px;border-radius:var(--r);font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.brands a:hover{border-color:var(--ink)}
.row-scroll{display:grid;grid-auto-flow:column;grid-auto-columns:46%;gap:12px;overflow-x:auto;scrollbar-width:none;padding-bottom:6px}
@media(min-width:760px){.row-scroll{grid-auto-columns:23%}}
.row-scroll::-webkit-scrollbar{display:none}
/* toolbar */
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:14px 0 10px;position:sticky;top:var(--hh,108px);background:#fff;z-index:10}
.toolbar .count{color:var(--muted);font-size:13px;margin-right:auto}
.toolbar select{width:auto;padding:9px 10px;border-radius:999px;border-color:var(--line);font-size:13px}
.fbtn{border-radius:999px;border-color:var(--line);padding:9px 14px;font-size:13px;display:flex;gap:6px;align-items:center}
.fbtn.on{border-color:var(--ink);font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding-bottom:10px}
.chip{border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12.5px;background:var(--soft);display:inline-flex;gap:6px;align-items:center}
.chip.x{cursor:pointer}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
/* grid */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 10px;padding-bottom:50px}
@media(min-width:760px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:30px 16px}}
@media(min-width:1100px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.card{display:block;position:relative}
.ph{aspect-ratio:3/4;background:var(--soft);position:relative;overflow:hidden;border-radius:var(--r)}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .35s}
.ph img.b{opacity:0}
@media(hover:hover){.card:hover .ph img.b{opacity:1}}
.ph .noimg{position:absolute;inset:0;display:grid;place-items:center;font-family:Jost,sans-serif;letter-spacing:.2em;color:var(--tan);font-size:26px}
.heart{position:absolute;right:8px;top:8px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.92);display:grid;place-items:center;padding:0;z-index:2}
.heart.on svg{fill:var(--ink)}
.badges{position:absolute;left:0;bottom:10px;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.bdg{background:#fff;font-size:11px;font-weight:700;padding:3px 8px;letter-spacing:.04em;text-transform:uppercase}
.bdg.sale{background:var(--sale);color:#fff}
.bdg.new{background:var(--ink);color:#fff}
.meta{padding:10px 2px 0}
.br{font-weight:700;font-size:13.5px}
.nm{color:#444;font-size:13.5px;margin:1px 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr{font-weight:600;font-size:14px}
.pr .old{color:var(--muted);text-decoration:line-through;font-weight:400;margin-left:6px;font-size:13px}
.pr.sale .now{color:var(--sale)}
.sz{color:var(--muted);font-size:12px;margin-top:3px}
.dots{display:flex;gap:4px;margin-top:6px}
.dot{width:12px;height:12px;border-radius:50%;border:1px solid rgba(0,0,0,.18);flex:none}
.empty{text-align:center;color:var(--muted);padding:60px 0}
/* product page */
.crumbs{font-size:12.5px;color:var(--muted);padding:14px 0}
.crumbs a:hover{text-decoration:underline}
.pd{display:grid;grid-template-columns:1fr;gap:24px;padding-bottom:40px}
@media(min-width:900px){.pd{grid-template-columns:1.25fr 1fr;gap:44px}}
.gal{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:900px){.gal{grid-template-columns:76px 1fr}}
.thumbs{display:none;flex-direction:column;gap:8px}
@media(min-width:900px){.thumbs{display:flex}}
.thumbs img{width:76px;aspect-ratio:3/4;object-fit:cover;border:1px solid transparent;cursor:pointer;border-radius:var(--r)}
.thumbs img.on{border-color:var(--ink)}
.main{position:relative;aspect-ratio:3/4;background:var(--soft);overflow:hidden;border-radius:var(--r)}
.slides{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.slides::-webkit-scrollbar{display:none}
.slides img{flex:0 0 100%;width:100%;height:100%;object-fit:cover;scroll-snap-align:start}
.gdots{position:absolute;bottom:12px;left:0;right:0;display:flex;justify-content:center;gap:6px}
.gdots span{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.6);border:1px solid rgba(0,0,0,.15)}
.gdots span.on{background:var(--ink)}
.info .brl{font-weight:700;font-size:18px;text-decoration:underline;text-underline-offset:3px}
.info h1{font-size:20px;font-weight:400;margin:4px 0 10px}
.info .price{font-size:20px;font-weight:700}
.info .price .old{color:var(--muted);text-decoration:line-through;font-weight:400;font-size:15px;margin-left:8px}
.info .price.sale .now{color:var(--sale)}
.info .vat{font-size:12px;color:var(--muted)}
.opt{display:flex;flex-wrap:wrap;gap:8px}
.cbtn{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-color:var(--line);border-radius:999px}
.cbtn .dot{width:22px;height:22px}
.cbtn.on,.sbtn.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.sbtn{min-width:58px;padding:11px 12px;border-color:var(--line);font-weight:500}
.low{color:var(--sale);font-size:12.5px;font-weight:600;margin-top:8px;min-height:18px}
.cta{display:flex;gap:8px;margin-top:14px}
.cta .primary{flex:1;padding:15px;font-size:15px}
.cta .hbig{width:52px;padding:0;display:grid;place-items:center}
.cta .hbig.on svg{fill:var(--ink)}
.box{border:1px solid var(--line);border-radius:var(--r);margin-top:18px}
.box div.l{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-top:1px solid var(--line);font-size:13px}
.box div.l:first-child{border-top:0}
.box div.l b{display:block;font-size:13.5px}
.ask{display:flex;gap:8px;margin-top:14px}
.ask button{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;border-color:var(--line);font-size:13px}
details.acc{border-top:1px solid var(--line)}
details.acc:last-of-type{border-bottom:1px solid var(--line)}
details.acc summary{list-style:none;padding:16px 2px;font-weight:600;cursor:pointer;display:flex;justify-content:space-between}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary::after{content:'+';font-weight:400;font-size:18px}
details.acc[open] summary::after{content:'–'}
details.acc .c{padding:0 2px 16px;color:#333;white-space:pre-line;font-size:13.5px}
.sticky-buy{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;align-items:center;transform:translateY(110%);transition:transform .25s}
.sticky-buy.show{transform:none}
.sticky-buy .p{flex:1;min-width:0}
.sticky-buy .p div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
@media(min-width:900px){.sticky-buy{display:none}}
/* cart / checkout */
.page{display:grid;grid-template-columns:1fr;gap:24px;padding:20px 0 60px}
@media(min-width:900px){.page{grid-template-columns:1.6fr 1fr;gap:40px}}
.page h1{font-size:24px;margin:0 0 6px}
.line{display:flex;gap:14px;padding:16px 0;border-bottom:1px solid var(--line)}
.line img,.line .ni{width:90px;aspect-ratio:3/4;object-fit:cover;background:var(--soft);flex:none;border-radius:var(--r)}
.line .d{flex:1;min-width:0;font-size:13.5px}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:var(--r);margin-top:8px}
.qty button{border:0;padding:6px 12px}
.qty b{min-width:22px;text-align:center}
.link{border:0;background:none;padding:0;text-decoration:underline;font-size:12.5px;color:var(--muted)}
.sum{background:var(--soft);padding:20px;border-radius:var(--r);align-self:start;position:sticky;top:130px}
.sum .r{display:flex;justify-content:space-between;padding:6px 0;font-size:14px}
.sum .r.t{border-top:1px solid var(--line);margin-top:8px;padding-top:12px;font-weight:700;font-size:16px}
.sum .note{font-size:12.5px;color:var(--muted);margin-top:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.err{color:var(--sale);font-size:13.5px;margin-top:10px}
.ok{max-width:520px;margin:50px auto;text-align:center}
.ok .big{width:64px;height:64px;border-radius:50%;background:var(--good);color:#fff;display:grid;place-items:center;font-size:30px;margin:0 auto 14px}
/* filter sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:60;display:flex;justify-content:flex-end}
.sheet{background:#fff;width:100%;max-width:420px;height:100%;display:flex;flex-direction:column}
.sheet .hd{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line);font-weight:700;font-size:16px}
.sheet .bd{flex:1;overflow:auto;padding:4px 18px 20px}
.sheet .bd h4{margin:20px 0 10px;font-size:14px}
.sheet .ft{display:flex;gap:10px;padding:14px 18px;border-top:1px solid var(--line)}
.sheet .ft button{flex:1}
footer{background:var(--soft);margin-top:30px;padding:34px 0 50px;font-size:13px;color:#333}
.fcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:24px}
footer h4{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.08em}
footer p{margin:4px 0}
footer a{text-decoration:underline}
.pay{display:inline-block;border:1px solid var(--line);background:#fff;padding:5px 10px;border-radius:var(--r);font-weight:600;font-size:12px;margin-top:6px}
.nl{background:var(--accent);color:#fff;border-radius:var(--r);padding:26px 22px;margin:34px 0 10px;display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:800px){.nl{grid-template-columns:1fr 1.1fr;align-items:center;padding:34px 40px}}
.nl h2{margin:0 0 6px;font-family:Jost,sans-serif;font-weight:400;font-size:28px}
.nl p{margin:0;opacity:.9}
.nl form{display:grid;gap:8px}
.nl input{border-color:transparent}
.nl .cons{font-size:12px;opacity:.85;display:flex;gap:8px;align-items:flex-start}
.nl .cons input{width:auto;margin-top:2px}
.nl button{background:#fff;color:var(--accent);border-color:#fff;font-weight:700;padding:13px}
.nl .codebox{background:#fff;color:var(--ink);border-radius:var(--r);padding:16px;text-align:center}
.nl .codebox b{font-size:24px;letter-spacing:.12em;display:block;margin:6px 0}
.pop-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:70;display:grid;place-items:center;padding:16px}
.pop{max-width:440px;width:100%;position:relative;margin:0}
.pop .x{position:absolute;right:10px;top:10px;background:none;border:0;color:#fff;font-size:20px;padding:4px 8px}
@media(max-width:480px){.icons{gap:0}.ib{padding:6px}.lang{padding:4px 2px;font-size:12px}.hrow{gap:8px}}
.spam{display:flex;gap:10px;align-items:flex-start;background:#fff4d6;color:#5a4300;border-radius:4px;padding:10px 12px;font-size:13px;line-height:1.45}
.su-ok{background:rgba(255,255,255,.15);border-radius:4px;padding:8px 10px;font-size:13px}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:11.5px;font-weight:700;letter-spacing:.02em;position:relative}
.avatar::after{content:'';position:absolute;right:-1px;bottom:-1px;width:9px;height:9px;border-radius:50%;background:#2fa35a;border:2px solid #fff}
.sharebtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:10px;border-color:var(--line);font-weight:500}
.sharebox{background:#fff;border-radius:8px;padding:22px 20px;max-width:420px;width:100%;position:relative}
.sharebox .x{position:absolute;right:10px;top:10px;border:0;background:none;font-size:18px;padding:4px 8px}
.sharegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 8px}
.sharegrid a{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12.5px;text-align:center}
.sharegrid span{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:18px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:var(--r);z-index:90;font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.2)}
</style>
</head>
<body>
<div class="promo" id="promo"></div>
<header id="hdr"><div class="wrap">
  <div class="hrow">

    <div class="search"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" autocomplete="off"></div>

      <select class="lang" id="lang" aria-label="language"></select>
      <a class="ib" href="#/account" aria-label="account" id="accicon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg></a>
      <a class="ib" href="#/wish" aria-label="wishlist"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg><span class="cnt" id="wcnt" hidden></span></a>
      <a class="ib" href="#/cart" aria-label="cart"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M5 7h14l-1 13H6z"/><path d="M9 10V7a3 3 0 0 1 6 0v3"/></svg><span class="cnt" id="ccnt" hidden></span></a>
    </div>
  </div>
  <div class="search msearch"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q2" type="search" autocomplete="off"></div>

  <nav class="cats" id="cats"></nav>
</div></header>
<main class="wrap" id="view"><div class="empty">…</div></main>

<div class="sticky-buy" id="sbuy"></div>

const CMAP = {nero:'#1f1b1b',zeze:'#1f1b1b',black:'#1f1b1b',bianco:'#f7f5f0',bardhe:'#f7f5f0',white:'#f7f5f0',panna:'#efe6d2',crema:'#efe6d2',cream:'#efe6d2',bordo:'#6d1a2a',bordeaux:'#6d1a2a',burgundy:'#6d1a2a',rosso:'#c0272d',red:'#c0272d',kuqe:'#c0272d',rosa:'#e8a3b5',pink:'#e8a3b5',roze:'#e8a3b5',blu:'#1f3c88',blue:'#1f3c88',navy:'#1b2a4a',azzurro:'#7fb3e0',celeste:'#a7cdea',verde:'#2e6b3f',green:'#2e6b3f',beige:'#d9c3a5',bezhe:'#d9c3a5',cammello:'#b8875a',camel:'#b8875a',marrone:'#6b4430',brown:'#6b4430',kafe:'#6b4430',grigio:'#8c8c8c',grey:'#8c8c8c',gray:'#8c8c8c',gri:'#8c8c8c',giallo:'#e8c33d',yellow:'#e8c33d',viola:'#6a3d8f',purple:'#6a3d8f',oro:'#c9a54b',gold:'#c9a54b',argento:'#c0c0c0',silver:'#c0c0c0',kaki:'#8a8455',khaki:'#8a8455'};
const norm = c => String(c || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z ]/g, '').trim();
const hexOf = (c, h) => h || CMAP[norm(c)] || CMAP[norm(c).split(' ')[0]] || CMAP[norm(c).split(' ').pop()] || null;
const SIZE_ORDER = ['XXS','XS','S','M','L','XL','XXL','XXXL','TU','U'];
const sRank = z => { const u = String(z || '').toUpperCase(); const i = SIZE_ORDER.indexOf(u); return i >= 0 ? i : (isNaN(Number(u)) ? 100 : 200 + Number(u)); };
const sizeLbl = z => ['TU','U'].includes(String(z).toUpperCase()) ? t('one') : z;
const HEART = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>';
const NEW_DAYS = 21;

let CODE = store.get('mvshop_code', null), CODEOK = null, TOK = store.get('mvshop_tok', null), ME = null;
let G = store.get('mvshop_g', '');
const gOk = p => !G || p.gender === G || p.gender === 'unisex';
let P = [], URLS = {}, CART = store.get('mvshop_cart', []), WISH = store.get('mvshop_wish', []), Q = '', SORT = 'new', F = {size:[], color:[], brand:[], cat:'', grp:'', min:'', max:'', sale:false, news:false};
const saveCart = () => { store.set('mvshop_cart', CART); badges(); };
const saveWish = () => { store.set('mvshop_wish', WISH); badges(); };
function toast(m, html){ document.querySelectorAll('.toast').forEach(x => x.remove()); const d = document.createElement('div'); d.className = 'toast'; if (html) d.innerHTML = m; else d.textContent = m; document.body.appendChild(d); setTimeout(() => d.remove(), 2600); }
const price = p => { const ps = p.variants.map(v => Number(v.price)); return Math.min(...ps); };
const isSale = p => Number(p.list_price) > price(p) + 0.5;
const pct = p => Math.round((1 - price(p) / Number(p.list_price)) * 100);
const isNew = p => (Date.now() - new Date(p.created_at).getTime()) < NEW_DAYS * 864e5;
const pieces = p => p.variants.reduce((a, v) => a + v.available, 0);
const sizesOf = p => [...new Set(p.variants.map(v => v.size))].sort((a, b) => sRank(a) - sRank(b));
const colorsOf = p => [...new Map(p.variants.map(v => [norm(v.color), v])).values()];
const pUrl = id => (location.protocol === 'file:' ? location.href.split('#')[0] + '#/p/' + id : location.origin + '/p/' + id + '/');

async function load(){
  const {data, error} = await sb.rpc('shop_catalog');
  if (error){ $('#view').innerHTML = `<div class="empty">${t('e_generic')}</div>`; return; }
  P = data || [];
  const paths = P.flatMap(p => p.photos);
  if (paths.length){ const r = await sb.storage.from('foto').createSignedUrls(paths, 60 * 60 * 6); (r.data || []).forEach(x => { if (x.signedUrl) URLS[x.path] = x.signedUrl; }); }
  const avail = {}; P.forEach(p => p.variants.forEach(v => avail[v.id] = v.available));
  CART = CART.filter(c => avail[c.v] > 0).map(c => ({...c, q: Math.min(c.q, avail[c.v])})); saveCart();
  WISH = WISH.filter(id => P.some(p => p.id === id)); saveWish();
  chrome(); route();
}
function chrome(){
  document.documentElement.lang = L;

  $('#lang').innerHTML = LANGS.map(l => `<option value="${l}" ${l === L ? 'selected' : ''}>${l.toUpperCase()}</option>`).join('');
  ['#q', '#q2'].forEach(s => { $(s).placeholder = t('search'); $(s).value = Q; });
  const PG = P.filter(gOk);

  $('#cats').innerHTML = `<a href="#/shop" class="${r.startsWith('#/shop') && !F.cat && !F.grp && !F.news && !F.sale ? 'on' : ''}">${t('all')}</a>` +

    (PG.some(isSale) ? `<a href="#/shop?sale" class="hot ${F.sale ? 'on' : ''}">${t('sale')}</a>` : '') +
    `<a href="#/brands">${t('brands')}</a>`;
  $('#foot').innerHTML = `<div><h4>${t('f_about')}</h4><p>${t('f_about_t')}</p></div>
    <div><h4>${t('f_help')}</h4><p>${t('f_how')}</p></div>
    <div><h4>${t('f_contact')}</h4><p><a href="https://wa.me/${WA_NUMBER}" target="_blank" rel="noopener">WhatsApp +${WA_NUMBER.replace(/^(\d{2})(\d{3})(\d{3})(\d+)/, '$1 $2 $3 $4')}</a></p><p><a href="https://www.instagram.com/${IG_USER}/" target="_blank" rel="noopener">Instagram @${IG_USER}</a></p><p><a href="mailto:${EMAIL}">${EMAIL}</a></p></div>
    <div><h4>${t('f_pay')}</h4><span class="pay">💶 ${t('d1')}</span><p style="margin-top:12px"><a href="javascript:openSignup()">🎁 ${t('nl_t')}</a></p></div>`;
  badges();
}
function accIcon(){ const a = $('#accicon'); if (!a) return;
  if (ME){ const ini = ME.name.split(/\s+/).filter(Boolean).slice(0, 2).map(x => x[0].toUpperCase()).join(''); a.innerHTML = `<span class="avatar" title="${esc(ME.name)}">${esc(ini)}</span>`; a.setAttribute('aria-label', ME.name); }
  else { a.innerHTML = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>'; a.setAttribute('aria-label', 'account'); } }
function badges(){ accIcon(); const n = CART.reduce((a, c) => a + c.q, 0); const c = $('#ccnt'); c.hidden = !n; c.textContent = n; const w = $('#wcnt'); w.hidden = !WISH.length; w.textContent = WISH.length; }
$('#lang').addEventListener('change', e => { L = e.target.value; store.set('mvshop_lang2', L); chrome(); route(); });
const onSearch = e => { Q = e.target.value; ['#q', '#q2'].forEach(s => { if ($(s) !== e.target) $(s).value = Q; }); if (!location.hash.startsWith('#/shop')) location.hash = '#/shop'; else renderShop(true); };
$('#q').addEventListener('input', onSearch); $('#q2').addEventListener('input', onSearch);

// ---------- router ----------
window.addEventListener('hashchange', route);
function route(){
  const h = location.hash || '#/';
  $('#sbuy').classList.remove('show');
  const legacy = h.match(/^#p\/(\d+)/); if (legacy) { location.replace('#/p/' + legacy[1]); return; }
  const pm = h.match(/^#\/p\/(\d+)/);
  if (h.startsWith('#/shop')){ const qs = new URLSearchParams(h.split('?')[1] || ''); if (qs.has('g')){ G = qs.get('g') === 'all' ? '' : qs.get('g'); store.set('mvshop_g', G); } F.cat = qs.get('cat') || ''; F.grp = qs.get('grp') || ''; F.news = qs.has('news'); F.sale = qs.has('sale'); const b = qs.get('brand'); F.brand = b ? [b] : (qs.has('keep') ? F.brand : []); chrome(); renderShop(); }
  else if (pm) renderProduct(Number(pm[1]));
  else if (h === '#/cart') renderCart();
  else if (h === '#/checkout') renderCheckout();
  else if (h === '#/wish') renderWish();
  else if (h === '#/account') renderAccount();
  else if (h === '#/reset') renderReset(1);
  else if (h.startsWith('#/verify')) renderVerify();
  else if (h === '#/brands') renderBrands();
  else renderHome();
  if (!pm) window.scrollTo(0, 0);
  setHH();
}
function setHH(){ document.documentElement.style.setProperty('--hh', $('#hdr').offsetHeight + 'px'); }
window.addEventListener('resize', setHH);

// ---------- cards ----------
function card(p){
  const a = URLS[p.photos[0]], b = URLS[p.photos[1]], sale = isSale(p), cols = colorsOf(p);
  return `<a class="card" href="#/p/${p.id}"><div class="ph">${a ? `<img src="${esc(a)}" alt="${esc(p.brand + ' ' + p.name)}" loading="lazy">` : '<div class="noimg">MV</div>'}${b ? `<img class="b" src="${esc(b)}" alt="" loading="lazy">` : ''}
    <button class="heart ${WISH.includes(p.id) ? 'on' : ''}" onclick="event.preventDefault();toggleWish(${p.id},this)" aria-label="wishlist">${HEART}</button>
    <div class="badges">${sale ? `<span class="bdg sale">-${pct(p)}%</span>` : ''}${isNew(p) ? `<span class="bdg new">${t('b_new')}</span>` : ''}${pieces(p) === 1 ? `<span class="bdg">${t('b_last')}</span>` : ''}</div></div>
    <div class="meta"><div class="br">${esc(p.brand || '')}</div><div class="nm">${esc(p.name)}</div>
    <div class="pr ${sale ? 'sale' : ''}"><span class="now">${eur(price(p))}</span>${sale ? `<span class="old">${eur(p.list_price)}</span>` : ''}</div>
    <div class="sz">${sizesOf(p).map(sizeLbl).map(esc).join(' · ')}</div>
    ${cols.some(v => v.color) && cols.length > 1 ? `<div class="dots">${cols.map(v => `<span class="dot" title="${esc(v.color)}" style="background:${hexOf(v.color, v.color_hex) || RAINBOW}"></span>`).join('')}</div>` : ''}</div></a>`;
}
function toggleWish(id, el){ const i = WISH.indexOf(id); if (i >= 0) WISH.splice(i, 1); else WISH.push(id); saveWish(); document.querySelectorAll(`[data-wish="${id}"]`).forEach(x => x.classList.toggle('on', WISH.includes(id))); if (el) el.classList.toggle('on', WISH.includes(id)); if (location.hash === '#/wish') renderWish(); }

// ---------- account ----------

  if (!TOK){ ME = null; return; }
  const {data} = await sb.rpc('shop_me', {p_token: TOK});
  ME = data || null;
  if (!ME){ TOK = null; store.set('mvshop_tok', null); return; }
  store.set('mvshop_me', {name: ME.name, phone: ME.phone, instagram: ME.instagram || '', country: ME.country || 'AL', city: ME.city || '', address: ME.address || ''});
  if (ME.code){ store.set('mvshop_nl', ME.code); if (!ME.code.used && !CODE){ CODE = ME.code.code; store.set('mvshop_code', CODE); } }
}

async function doLogin(e){
  e.preventDefault(); const f = e.target; $('#lerr').textContent = '';
  const {data, error} = await sb.rpc('shop_login', {p_phone: f.phone.value, p_password: f.pw.value});
  if (error){ const m = String(error.message || ''); $('#lerr').textContent = t(m.includes('locked') ? 'e_locked' : 'e_bad_login'); return; }
  TOK = data.token; store.set('mvshop_tok', TOK); await loadMe(); renderAccount();
}
async function doLogout(){ try { await sb.rpc('shop_logout', {p_token: TOK}); } catch (e) {} TOK = null; ME = null; store.set('mvshop_tok', null); store.set('mvshop_me', {}); store.set('mvshop_nl', null); store.set('mvshop_code', null); CODE = null; CODEOK = null; renderAccount(); }
async function saveMe(e){
  e.preventDefault(); const f = e.target;
  const {error} = await sb.rpc('shop_update_me', {p_token: TOK, p_name: f.name.value, p_email: f.email.value, p_instagram: f.ig.value, p_country: f.country.value, p_city: f.city.value, p_address: f.address.value, p_lang: L});
  if (error){ toast(t('e_generic')); return; } await loadMe(); toast('✓ ' + t('saved'));
}

function renderReset(step, login, hint){
  chrome();
  $('#view').innerHTML = `<div class="crumbs"><a href="#/">${t('home')}</a> / <a href="#/account">${t('acc')}</a> / ${t('fg_t')}</div>

  : `<p style="font-size:14px">${t('fg_sent', hint ? '(' + esc(hint) + ')' : '')}</p>

async function resetStep1(e){
  e.preventDefault(); const login = e.target.login.value.trim(); $('#rerr').textContent = ''; e.target.querySelector('button').disabled = true;
  const {data, error} = await sb.rpc('shop_request_reset', {p_login: login});
  if (error){ const m = String(error.message || ''); $('#rerr').textContent = t(m.includes('email_unavailable') ? 'e_email_unavailable' : m.includes('too_many') ? 'e_too_many' : 'e_generic'); e.target.querySelector('button').disabled = false; return; }
  renderReset(2, login, data?.hint);
}
async function resetStep2(e){
  e.preventDefault(); const f = e.target; $('#rerr').textContent = '';
  if (f.pw.value.length < 6){ $('#rerr').textContent = t('e_short_password'); return; }
  const {data, error} = await sb.rpc('shop_confirm_reset', {p_login: f.login.value, p_code: f.code.value, p_password: f.pw.value});
  if (error){ const m = String(error.message || ''); const k = ['bad_code','code_expired','short_password'].find(x => m.includes(x)); $('#rerr').textContent = t(k === 'bad_code' ? 'e_rbad_code' : 'e_' + (k || 'generic')); return; }
  TOK = data.token; store.set('mvshop_tok', TOK); await loadMe(); toast('✓ ' + t('saved')); location.hash = '#/account';
}

const MAIL_DOMAINS = ['gmail.com','yahoo.com','hotmail.com','outlook.com','icloud.com','live.com','libero.it','hotmail.it','yahoo.it','gmail.al'];
function emailTypo(e){ const [u, d] = e.split('@'); if (!d || MAIL_DOMAINS.includes(d)) return null;
  const dist = (a, b) => { const m = Array.from({length: a.length + 1}, (_, i) => [i, ...Array(b.length).fill(0)]); for (let j = 1; j <= b.length; j++) m[0][j] = j;
    for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++) m[i][j] = Math.min(m[i-1][j] + 1, m[i][j-1] + 1, m[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1)); return m[a.length][b.length]; };
  const best = MAIL_DOMAINS.map(x => [x, dist(d, x)]).sort((a, b) => a[1] - b[1])[0]; return best && best[1] > 0 && best[1] <= 2 ? u + '@' + best[0] : null; }

function filtered(){

    if (!gOk(p)) return false;
    if (F.grp && String(p.group?.id) !== String(F.grp)) return false;
    if (F.cat && String(p.category?.id) !== String(F.cat)) return false;
    if (F.news && !isNew(p)) return false;
    if (F.sale && !isSale(p)) return false;
    if (F.brand.length && !F.brand.includes(p.brand)) return false;
    if (F.size.length && !p.variants.some(v => F.size.includes(v.size))) return false;
    if (F.color.length && !p.variants.some(v => F.color.includes(norm(v.color)))) return false;
    if (F.min !== '' && price(p) < Number(F.min)) return false;
    if (F.max !== '' && price(p) > Number(F.max)) return false;
    if (q){ const hay = norm([p.brand, p.name, p.category?.it, p.category?.en, p.category?.sq, ...p.variants.map(v => v.color)].join(' ')); if (!q.split(' ').every(w => hay.includes(w))) return false; }
    return true; });
  if (SORT === 'low') list.sort((a, b) => price(a) - price(b));
  else if (SORT === 'high') list.sort((a, b) => price(b) - price(a));

const trMat = txt => L === 'it' ? txt : String(txt).replace(/[A-Za-zÀ-ÿ]+/g, w => { const m = MAT_TX[w.toLowerCase()]; return m ? m[L === 'en' ? 0 : 1] : w; });
const detVal = (k, v) => DET_OPTS[k] ? (DET_OPTS[k][v]?.[LIX()] || v) : (['composition','lining','padding','upper','sole'].includes(k) ? trMat(v) : v);
function detRows(d, keys){ return keys.filter(k => d && d[k]).map(k => `<div style="display:flex;gap:10px;padding:3px 0"><b style="min-width:42%;font-weight:600">${esc(DET_LABELS[k][LIX()])}:</b><span>${esc(detVal(k, d[k]))}</span></div>`).join(''); }

// ---------- product ----------
let SEL = {};
function renderProduct(id){
  chrome();
  const p = P.find(x => x.id === id);
  if (!p){ $('#view').innerHTML = P.length ? `<div class="empty">${t('none')}</div>` : `<div class="empty">…</div>`; return; }
  const groups = {}; p.variants.forEach(v => { const k = norm(v.color); (groups[k] = groups[k] || {name: v.color, hex: hexOf(v.color, v.color_hex), list: []}).list.push(v); });
  Object.values(groups).forEach(g => g.list.sort((a, b) => sRank(a.size) - sRank(b.size)));
  SEL = {p, groups, col: SEL.p?.id === id && groups[SEL.col] ? SEL.col : Object.keys(groups)[0], v: null};
  if (groups[SEL.col].list.length === 1) SEL.v = groups[SEL.col].list[0];
  const photos = p.photos.map(x => URLS[x]).filter(Boolean);
  const desc = (L === 'en' && p.description_en) || (L === 'sq' && p.description_sq) || p.description || '';
  const sale = isSale(p);
  const related = P.filter(x => x.id !== p.id && (x.category?.id === p.category?.id || x.brand === p.brand)).slice(0, 8);
  $('#view').innerHTML = `<div class="crumbs"><a href="#/">${t('home')}</a> / ${p.category?.id ? `<a href="#/shop?cat=${p.category.id}">${esc(p.category[L])}</a> / ` : ''}${esc(p.name)}</div>
  <div class="pd"><div class="gal"><div class="thumbs">${photos.map((u, i) => `<img src="${esc(u)}" alt="" class="${i ? '' : 'on'}" onclick="goSlide(${i})">`).join('')}</div>
    <div class="main"><div class="slides" id="slides" onscroll="slideDots()">${photos.length ? photos.map(u => `<img src="${esc(u)}" alt="${esc(p.brand + ' ' + p.name)}">`).join('') : '<div class="ph" style="flex:0 0 100%"><div class="noimg">MV</div></div>'}</div>
    ${photos.length > 1 ? `<div class="gdots" id="gdots">${photos.map((_, i) => `<span class="${i ? '' : 'on'}"></span>`).join('')}</div>` : ''}
    <div class="badges" style="bottom:14px">${sale ? `<span class="bdg sale">-${pct(p)}%</span>` : ''}${isNew(p) ? `<span class="bdg new">${t('b_new')}</span>` : ''}</div></div></div>
  <div class="info"><a class="brl" href="#/shop?brand=${encodeURIComponent(p.brand || '')}">${esc(p.brand || '')}</a><h1>${esc(p.name)}</h1>
    <div class="price ${sale ? 'sale' : ''}" id="price"></div>
    <div id="opts"></div><div class="low" id="low"></div>
    <div class="cta"><button class="primary" id="addb" onclick="addToCart()">${t('add')}</button><button class="hbig ${WISH.includes(p.id) ? 'on' : ''}" data-wish="${p.id}" onclick="toggleWish(${p.id})" aria-label="wishlist">${HEART}</button></div>
    <button class="sharebtn" onclick="shareProduct(${p.id})"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg><span>${t('share')}</span></button>
    ${nlBand()}
    <div class="box"><div class="l">💶<div><b>${t('d1')}</b>${t('d1s')}</div></div><div class="l">🚚<div><b>${t('d2')}</b>${t('d2s')}</div></div><div class="l">🔁<div><b>${t('d3')}</b>${t('d3s')}</div></div></div>
    <div style="margin-top:18px;font-size:13px;font-weight:600">${t('ask')}</div>
    <div class="ask"><button onclick="askWA(${p.id})"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M20 12a8 8 0 1 1-3.6-6.7A8 8 0 0 1 20 12z"/><path d="M4.5 19.5 6 15.6"/></svg>${t('ask_wa')}</button><button onclick="askIG(${p.id})"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/></svg>${t('ask_ig')}</button></div>
    <div style="margin-top:18px">${desc ? `<details class="acc" open><summary>${t('desc')}</summary><div class="c">${esc(desc)}</div></details>` : ''}
    ${(() => { const d = p.details || {}; const comp = detRows(d, ['composition','lining','padding','structure','care','upper','sole','heel']); const det = detRows(d, ['neckline','closure','details','style_code']); const fit = detRows(d, ['fit','silhouette','length','sleeve','measures']);
      return (comp ? `<details class="acc" open><summary>${t('d_comp')}</summary><div class="c" style="white-space:normal">${comp}</div></details>` : '') +
        (det ? `<details class="acc"><summary>${t('d_det')}</summary><div class="c" style="white-space:normal">${det}</div></details>` : '') +
        `<details class="acc"><summary>${t('fit')}</summary><div class="c" style="white-space:normal">${fit}${fit ? '<div style="margin-top:10px"></div>' : ''}<div style="white-space:pre-line">${esc(p.size_guide || t('fit_def'))}</div></div></details>`; })()}
    <details class="acc"><summary>${t('ship')}</summary><div class="c">${t('ship_t')}</div></details></div></div></div>
  ${related.length ? `<h2 class="sec">${t('like')}</h2><div class="row-scroll" style="padding-bottom:30px">${related.map(card).join('')}</div>` : ''}`;
  $('#sbuy').innerHTML = `<div class="p"><b>${esc(p.brand || '')}</b><div>${esc(p.name)}</div></div><button class="primary" onclick="sbuyClick()" id="sbuyb">${t('add')}</button>`;
  drawOpts(); window.scrollTo(0, 0);
  const io = new IntersectionObserver(es => es.forEach(e => $('#sbuy').classList.toggle('show', !e.isIntersecting && location.hash.startsWith('#/p/'))));
  io.observe($('#addb'));
}
function sbuyClick(){ if (!SEL.v){ $('#opts').scrollIntoView({behavior:'smooth', block:'center'}); toast(t('choose_size')); } else addToCart(); }
function goSlide(i){ const s = $('#slides'); s.scrollTo({left: i * s.clientWidth, behavior:'smooth'}); }
function slideDots(){ const s = $('#slides'); const i = Math.round(s.scrollLeft / s.clientWidth); document.querySelectorAll('#gdots span').forEach((x, j) => x.classList.toggle('on', i === j)); document.querySelectorAll('.thumbs img').forEach((x, j) => x.classList.toggle('on', i === j)); }
function drawOpts(){
  const {groups, col, v, p} = SEL; const keys = Object.keys(groups); const g = groups[col];
  $('#opts').innerHTML = `${keys.length > 1 || g.name ? `<label>${t('color')}: <span style="font-weight:400">${esc(g.name || '')}</span></label><div class="opt">${keys.map(k => `<button class="cbtn ${k === col ? 'on' : ''}" onclick="pickCol('${esc(k)}')"><span class="dot" style="background:${groups[k].hex || RAINBOW}"></span>${esc(groups[k].name || '—')}</button>`).join('')}</div>` : ''}
  <label>${t('size')}</label><div class="opt">${g.list.map(x => `<button class="sbtn ${v?.id === x.id ? 'on' : ''}" onclick="pickV(${x.id})">${esc(sizeLbl(x.size))}</button>`).join('')}</div>`;
  const pr = v ? Number(v.price) : Math.min(...g.list.map(x => Number(x.price)));
  const sale = Number(p.list_price) > pr + 0.5;
  $('#price').className = 'price' + (sale ? ' sale' : '');
  $('#price').innerHTML = `<span class="now">${eur(pr)}</span>${sale ? `<span class="old">${eur(p.list_price)}</span>` : ''}`;
  $('#low').textContent = v && v.available <= 2 ? t('only_left', v.available) : '';
  $('#addb').textContent = v ? t('add') : t('choose_size');
  const sb2 = $('#sbuyb'); if (sb2) sb2.textContent = v ? `${t('add')} · ${eur(pr)}` : t('choose_size');
}
function pickCol(k){ SEL.col = k; const g = SEL.groups[k]; SEL.v = g.list.length === 1 ? g.list[0] : null; drawOpts(); }
function pickV(id){ SEL.v = SEL.groups[SEL.col].list.find(x => x.id === id); drawOpts(); }
function addToCart(){
  if (!SEL.v){ toast(t('choose_size')); $('#opts').scrollIntoView({behavior:'smooth', block:'center'}); return; }
  const ex = CART.find(c => c.v === SEL.v.id);
  if (ex) ex.q = Math.min(SEL.v.available, ex.q + 1); else CART.push({v: SEL.v.id, q: 1});
  saveCart(); toast(`✓ ${t('added')} · <a href="#/cart" style="text-decoration:underline">${t('go_cart')}</a>`, true);
}
function askText(id){ const p = P.find(x => x.id === id); const v = SEL.p?.id === id ? SEL.v : null; return `${pUrl(id)}\n${t('ask_msg')} ${p ? p.brand + ' · ' + p.name : ''}${v ? ' (' + [v.color, sizeLbl(v.size)].filter(Boolean).join(' · ') + ')' : ''}\n`; }
async function askIG(id){ const txt = askText(id); try { await navigator.clipboard.writeText(txt); toast(t('ask_copied')); } catch (e) {} setTimeout(() => window.open('https://ig.me/m/' + IG_USER, '_blank', 'noopener'), 900); }
async function shareProduct(id){
  const p = P.find(x => x.id === id); if (!p) return;
  const url = pUrl(id), title = `${p.brand || ''} ${p.name}`.trim(), text = `${title} · ${eur(price(p))} · Modus Vestendi`;
  if (navigator.share){ try { await navigator.share({title, text, url}); return; } catch (e) { if (e.name === 'AbortError') return; } }
  const enc = encodeURIComponent, msg = enc(text + '\n' + url);
  const bg = document.createElement('div'); bg.className = 'pop-bg';
  bg.innerHTML = `<div class="sharebox"><button class="x" aria-label="close">✕</button><h3 style="margin:0 0 4px">${t('share')}</h3><div style="color:var(--muted);font-size:13px;margin-bottom:14px">${esc(title)}</div>
    <div class="sharegrid">
      <a href="https://wa.me/?text=${msg}" target="_blank" rel="noopener"><span style="background:#25d366">W</span>WhatsApp</a>
      <a href="https://www.facebook.com/sharer/sharer.php?u=${enc(url)}" target="_blank" rel="noopener"><span style="background:#1877f2">f</span>Facebook</a>
      <a href="https://t.me/share/url?url=${enc(url)}&text=${enc(text)}" target="_blank" rel="noopener"><span style="background:#29a9eb">✈</span>Telegram</a>
      <a href="viber://forward?text=${msg}"><span style="background:#7360f2">V</span>Viber</a>
      <a href="mailto:?subject=${enc(title)}&body=${msg}"><span style="background:#6b6b6b">@</span>Email</a>
      <a href="#" data-copy><span style="background:var(--ink)">⧉</span>${t('copy_link')}</a>
    </div><input readonly value="${esc(url)}" style="margin-top:14px;font-size:13px"></div>`;
  bg.addEventListener('click', async e => {
    if (e.target === bg || e.target.closest('.x')) return bg.remove();
    if (e.target.closest('[data-copy]')){ e.preventDefault(); try { await navigator.clipboard.writeText(url); toast('✓ ' + t('link_copied')); } catch (x) { bg.querySelector('input').select(); } }
  });
  document.body.appendChild(bg);
}
function askWA(id){ window.open('https://wa.me/' + WA_NUMBER + '?text=' + encodeURIComponent(askText(id)), '_blank', 'noopener'); }

// ---------- wishlist ----------
function renderWish(){
  chrome();
  const list = WISH.map(id => P.find(p => p.id === id)).filter(Boolean);
  $('#view').innerHTML = `<div class="crumbs"><a href="#/">${t('home')}</a> / ${t('wish')}</div><h1 style="font-size:24px">${t('wish')}</h1>
    ${list.length ? `<div class="grid">${list.map(card).join('')}</div>` : `<div class="empty">${t('wish_empty')}<p><button onclick="location.hash='#/shop'">${t('continue')}</button></p></div>`}`;
}

// ---------- cart & checkout ----------
const findV = id => { for (const p of P){ const v = p.variants.find(x => x.id === id); if (v) return [p, v]; } return []; };
const cartLines = () => CART.map(c => { const [p, v] = findV(c.v); return p ? {c, p, v} : null; }).filter(Boolean);
const cartTotal = () => cartLines().reduce((a, l) => a + l.c.q * Number(l.v.price), 0);
const discAmt = () => { if (!CODEOK) return 0; const mx = Math.max(0, ...cartLines().map(l => Number(l.v.price))); return Math.round(mx * CODEOK.pct) / 100; };
function summaryBox(btn, withCode){
  const tot = cartTotal(), d = discAmt();
  return `<aside class="sum" id="sumbox"><h3 style="margin:0 0 10px">${t('summary')}</h3><div class="r"><span>${t('subtotal')}</span><span>${eur(tot)}</span></div>
    ${d ? `<div class="r" style="color:var(--sale)"><span>${t('disc')} ${CODEOK ? CODEOK.pct : ''}% · ${t('one_item')} (${esc(CODE)})</span><span>−${eur(d)}</span></div>` : ''}
    <div class="r"><span>${t('shipping')}</span><span style="color:var(--muted)">${t('ship_tbd')}</span></div>
    <div class="r t"><span>${t('total')}</span><span>${eur(tot - d)}</span></div>
    ${withCode ? `<label style="margin-top:14px">${t('code')}</label><div style="display:flex;gap:6px"><input id="codein" value="${esc(CODE || '')}" placeholder="MV10-…" style="text-transform:uppercase"><button type="button" onclick="applyCode()">${t('apply')}</button></div><div id="codemsg" style="font-size:12.5px;margin-top:6px;${CODEOK ? 'color:var(--good)' : ''}">${CODEOK ? t('code_ok', CODEOK.pct) : ''}</div>` : ''}
    ${btn || ''}<div class="note">💶 ${t('pay_cod')}</div></aside>`;
}
async function applyCode(silent){
  const inp = $('#codein'); const c = (inp ? inp.value : CODE || '').trim().toUpperCase();
  if (!c){ CODE = null; CODEOK = null; store.set('mvshop_code', null); refreshSum(); return; }
  const {data} = await sb.rpc('shop_check_code', {p_code: c});
  if (data && data.valid){ CODE = c; CODEOK = {pct: Number(data.pct)}; store.set('mvshop_code', c); }
  else { CODEOK = null; if (!silent){ const m = $('#codemsg'); if (m){ m.style.color = 'var(--sale)'; m.textContent = data?.used ? t('e_code_used') : t('e_bad_code'); } return; } }
  refreshSum();
}
function refreshSum(){ if (location.hash === '#/cart') renderCart(); else if (location.hash === '#/checkout'){ const b = $('#sendb'); const old = $('#sumbox'); if (old){ const tmp = document.createElement('div'); tmp.innerHTML = checkoutSummary(); old.replaceWith(tmp.firstElementChild); } if (b) b.textContent = `${t('send')} · ${eur(cartTotal() - discAmt())}`; } }
function renderCart(){
  chrome();
  const lines = cartLines();
  if (!lines.length){ $('#view').innerHTML = `<div class="ok"><h1 style="font-size:22px">${t('cart')}</h1><p class="empty" style="padding:20px 0">${t('cart_empty')}</p><button class="primary" onclick="location.hash='#/shop'">${t('continue')}</button></div>`; return; }
  $('#view').innerHTML = `<div class="page"><div><h1>${t('cart')} <span style="font-weight:400;color:var(--muted);font-size:16px">(${CART.reduce((a, c) => a + c.q, 0)})</span></h1>
    ${lines.map(l => `<div class="line"><a href="#/p/${l.p.id}">${URLS[l.p.photos[0]] ? `<img src="${esc(URLS[l.p.photos[0]])}" alt="">` : '<div class="ni"></div>'}</a>
      <div class="d"><div class="br">${esc(l.p.brand || '')}</div><div>${esc(l.p.name)}</div><div style="color:var(--muted);margin-top:4px">${esc([l.v.color, t('size') + ': ' + sizeLbl(l.v.size)].filter(Boolean).join(' · '))}</div>
      <div class="qty"><button onclick="chq(${l.v.id},-1)" aria-label="-">−</button><b>${l.c.q}</b><button onclick="chq(${l.v.id},1)" aria-label="+" ${l.c.q >= l.v.available ? 'disabled' : ''}>+</button></div>
      <div style="margin-top:8px"><button class="link" onclick="rmCart(${l.v.id})">${t('remove')}</button></div></div>
      <div style="font-weight:700">${eur(l.c.q * l.v.price)}</div></div>`).join('')}
    <p><a href="#/shop" style="text-decoration:underline">← ${t('continue')}</a></p></div>
    ${summaryBox(`<button class="primary" style="width:100%;padding:14px;margin-top:14px" onclick="location.hash='#/checkout'">${t('checkout')}</button>`, true)}</div>`;
  if (CODE && !CODEOK) applyCode(true);
}
function chq(id, d){ const c = CART.find(x => x.v === id); const [, v] = findV(id); if (!c) return; c.q = Math.max(1, Math.min(v?.available || 1, c.q + d)); saveCart(); renderCart(); }
function rmCart(id){ CART = CART.filter(c => c.v !== id); saveCart(); renderCart(); }
function renderCheckout(){
  chrome();
  if (!cartLines().length){ location.hash = '#/cart'; return; }
  const me = store.get('mvshop_me', {});
  const f = (n, lbl, type = 'text', extra = '') => `<label for="f_${n}">${t(lbl)}</label><input id="f_${n}" name="${n}" type="${type}" value="${esc(me[n] || '')}" ${extra}>`;
  $('#view').innerHTML = `<div class="page"><div><p><a href="#/cart" style="text-decoration:underline">${t('back_cart')}</a></p><h1>${t('checkout')}</h1>
    ${ME ? `<p style="font-size:13px;color:var(--muted)">${t('logged_as')} <b>${esc(ME.name)}</b></p>` : `<p style="font-size:13px">${t('have_acc')} <a href="#/account" style="text-decoration:underline;font-weight:600">${t('login')}</a></p>`}
    <form id="co" onsubmit="sendOrder(event)"><h3 style="margin:22px 0 0">${t('your_data')}</h3>
    ${f('name', 'name', 'text', 'required autocomplete="name"')}<div class="two"><div>${f('phone', 'phone', 'tel', 'required autocomplete="tel" inputmode="tel"')}</div><div>${f('instagram', 'ig', 'text', 'autocomplete="off" placeholder="@"')}</div></div>
    <h3 style="margin:26px 0 0">${t('delivery')}</h3>
    <div class="two"><div><label for="f_country">${t('country')}</label><select id="f_country" name="country">${COUNTRIES.map(([k, n]) => `<option value="${k}" ${(me.country || 'AL') === k ? 'selected' : ''}>${esc(n[LANGS.indexOf(L)])}</option>`).join('')}</select></div><div>${f('city', 'city', 'text', 'required autocomplete="address-level2"')}</div></div>
    ${f('address', 'address', 'text', 'required autocomplete="street-address"')}
    <label for="f_notes">${t('notes')}</label><textarea id="f_notes" name="notes" rows="3"></textarea>
    <p style="font-size:12.5px;color:var(--muted);margin-top:14px">${t('terms')}</p><div class="err" id="err"></div>
    <button class="primary" id="sendb" style="width:100%;padding:15px;margin-top:6px;font-size:15px">${t('send')} · ${eur(cartTotal() - discAmt())}</button></form></div>
    ${checkoutSummary()}</div>`;
  if (CODE && !CODEOK) applyCode(true);
}
const checkoutSummary = () => summaryBox(`<div style="margin-top:12px">${cartLines().map(l => `<div style="display:flex;gap:10px;align-items:center;padding:6px 0;font-size:13px">${URLS[l.p.photos[0]] ? `<img src="${esc(URLS[l.p.photos[0]])}" style="width:44px;aspect-ratio:3/4;object-fit:cover;border-radius:3px" alt="">` : ''}<div style="flex:1;min-width:0"><b>${esc(l.p.brand || '')}</b> ${esc(l.p.name)}<div style="color:var(--muted)">${esc(sizeLbl(l.v.size))}${l.v.color ? ' · ' + esc(l.v.color) : ''} · ${l.c.q}×</div></div><span>${eur(l.c.q * l.v.price)}</span></div>`).join('')}</div>`, true);
async function sendOrder(e){
  e.preventDefault();
  const fd = Object.fromEntries(new FormData(e.target).entries());
  store.set('mvshop_me', {name: fd.name, phone: fd.phone, instagram: fd.instagram, country: fd.country, city: fd.city, address: fd.address});
  const b = $('#sendb'); b.disabled = true; $('#err').textContent = '';
  const {data, error} = await sb.rpc('shop_order_v3', {p_token: TOK, p_name: fd.name, p_phone: fd.phone, p_instagram: fd.instagram, p_country: fd.country, p_city: fd.city, p_address: fd.address, p_lines: CART.map(c => ({variant_id: c.v, qty: c.q})), p_notes: fd.notes, p_lang: L, p_code: CODEOK ? CODE : null});
  if (!error && TOK) loadMe();
  if (error){
    const m = String(error.message || ''); const k = ['missing_contact','missing_address','not_available','too_many','bad_code','code_used','code_first_only'].find(x => m.includes(x));
    if (['bad_code','code_used','code_first_only'].includes(k)){ CODEOK = null; CODE = null; store.set('mvshop_code', null); }
    $('#err').textContent = t('e_' + (k || 'generic')); b.disabled = false;
    if (k === 'not_available'){ const id = Number(m.split(':').pop()); CART = CART.filter(c => c.v !== id); saveCart(); }
    return;
  }
  CART = []; saveCart(); if (CODEOK){ store.set('mvshop_code', null); const n = store.get('mvshop_nl', null); if (n) store.set('mvshop_nl', {...n, used: true}); CODE = null; CODEOK = null; }
  $('#view').innerHTML = `<div class="ok"><div class="big">✓</div><h1 style="font-size:24px">${t('ok_t')}</h1><p>${t('ok_p')}: <b>${esc(data)}</b></p><p style="color:var(--muted)">${t('ok_n')}</p><button class="primary" onclick="location.hash='#/';load()">${t('continue')}</button></div>`;
  window.scrollTo(0, 0);
}
chrome(); loadMe().then(() => load()); maybePopup();
</script>
</body>
</html>
